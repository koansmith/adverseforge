[project]
name = "adverseforge"
version = "0.1.0"
description = "Reproductions and extensions of seminal adversarial ML papers"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Aïmane Alassane"}]
license = {text = "MIT"}

dependencies = [
    # Core ML
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "scipy>=1.11",
    # Adversarial ML
    "torchattacks>=3.5.1",
    # robustbench and autoattack install from git — see scripts/install_extras.sh
    # NLP (si angle multilingual)
    "transformers>=4.35",
    "datasets>=2.14",
    # Visualisation
    "matplotlib>=3.7",
    "seaborn>=0.12",
    # Dev
    "jupyter>=1.0",
    "ipykernel>=6.25",
    "tqdm>=4.65",
    "pyyaml>=6.0",
    # Tracking
    "wandb>=0.16",
]

[project.optional-dependencies]
dev = ["ruff>=0.1", "pytest>=7.4", "pre-commit>=3.5"]

[tool.ruff]
line-length = 100
target-version = "py311"
